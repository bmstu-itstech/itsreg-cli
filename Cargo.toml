[package]
name = "itsreg-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "help", "env"] }
openapi = { path = "client" }
prettytable = "0.10.0"
reqwest = "0.13.4"
serde = "1.0.228"
serde_json = "1.0.150"
textwrap = "0.16.2"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
