[package]
name = "itsreg-cli"
version = "0.9.2"
edition = "2024"

[dependencies]
chrono = { version = "^0.4",  features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "help", "env"] }
console = "0.16.3"
prettytable = "0.10.0"
reqwest = { version = "^0.13", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
textwrap = "0.16.2"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
